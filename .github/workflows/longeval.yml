name: longeval research

on:
  push:
    paths: ["research/**", "scripts/pace/**", ".github/workflows/longeval.yml"]
  pull_request:
    paths: ["research/**", "scripts/pace/**", ".github/workflows/longeval.yml"]
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies and the released engine
        run: python -m pip install -r research/longeval/requirements.txt
      - name: Check the frozen protocol files
        run: python scripts/verify_freeze.py
      - name: Run the research tests
        run: python -m pytest -q research/longeval/tests scripts/pace/tests
      - name: Run the three-seed synthetic pilot
        run: |
          python -m research.longeval fixture build/longeval-fixture
          python -m research.longeval run --dataset build/longeval-fixture/dataset.json --output build/longeval-pilot --native-origin released-wheel
          python -m research.longeval verify build/longeval-pilot --dataset build/longeval-fixture/dataset.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: longeval-pilot-${{ matrix.os }}
          path: |
            build/longeval-fixture/
            build/longeval-pilot/
