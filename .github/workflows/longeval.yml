name: longeval research foundation

on:
  push:
    paths: ["research/longeval/**", "engine/**", ".github/workflows/longeval.yml"]
  pull_request:
    paths: ["research/longeval/**", "engine/**", ".github/workflows/longeval.yml"]
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies and the native source build
        run: |
          python -m pip install -r research/longeval/requirements.txt
          python -m pip install ./engine
      - name: Validate contracts and IR regression fixes
        run: python -m pytest -q research/longeval/tests engine/python/tests/test_ir.py
      - name: Run the three-seed synthetic pilot
        run: |
          python -m research.longeval fixture build/longeval-fixture
          python -m research.longeval run --dataset build/longeval-fixture/dataset.json --output build/longeval-pilot --native-origin checkout-build
          python -m research.longeval verify build/longeval-pilot --dataset build/longeval-fixture/dataset.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: longeval-pilot-${{ matrix.os }}
          path: |
            build/longeval-fixture/
            build/longeval-pilot/
